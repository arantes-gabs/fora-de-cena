name: Review draft candidates (manual, never publish)

# No push/PR/tag trigger. The owner must select a reviewed main commit.
# Uses only this repository's temporary GITHUB_TOKEN, never a personal token.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to prepare for private owner review
        type: choice
        options: [mac-linux, all, windows-x64, macos-arm64, macos-x86_64, linux-x86_64, linux-arm64]
        default: mac-linux
      expected_commit:
        description: Full 40-character SHA of the reviewed main commit
        type: string
        required: true
      owner_confirmed:
        description: Create beta draft assets for review only; no public release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fora-de-cena-review-draft
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  MPLBACKEND: Agg
  FDC_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  FDC_OWNER_CONFIRMED: ${{ inputs.owner_confirmed }}

jobs:
  prepare:
    if: github.repository == 'arantes-gabs/fora-de-cena' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.actor == 'arantes-gabs' && github.triggering_actor == 'arantes-gabs' && inputs.owner_confirmed
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Plan only the selected native targets
        id: plan
        env:
          FDC_TARGET: ${{ inputs.target }}
        run: |
          printf 'matrix=%s\n' "$(python tools/release_candidates.py plan --target "$FDC_TARGET")" >> "$GITHUB_OUTPUT"
      - name: Prepare matching beta draft and reviewed source archive
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_candidates.py prepare

  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
          architecture: ${{ matrix.architecture }}
      - name: Linux libraries on the disposable runner only
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libgles2 libglib2.0-0 libportaudio2 strace
      - name: Check dependency closure
        continue-on-error: ${{ matrix.target == 'macos-x86_64' }}
        run: |
          python -m pip install --only-binary=:all: packaging==26.3
          python tools/check_platform_wheels.py ${{ matrix.target }} --report work/wheels.json
      - name: Explicit MediaPipe Intel source build
        if: matrix.target == 'macos-x86_64'
        run: |
          python tools/ci_native.py intel-compatibility
          python -m pip install --only-binary=:all: macholib==1.16.4 altgraph==0.17.5
          python tools/build_mediapipe_intel.py
      - name: Minimal OpenCV in a separate build environment
        if: matrix.target != 'windows-x64' && matrix.target != 'macos-x86_64'
        run: |
          python tools/prepare_minimal_opencv.py
          python -m venv work/opencv-build-env
          work/opencv-build-env/bin/python -m pip install --only-binary=:all: -r requirements-opencv-build.txt
          work/opencv-build-env/bin/python tools/build_minimal_opencv.py --source work/opencv-minimal/source/opencv_contrib_python-4.14.0.94
      - name: Install the explicitly selected native wheels and locked application
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python tools/build_minimal_numpy.py
            python -m pip install --only-binary=:all: work/numpy-minimal/wheels/*.whl work/opencv-minimal/wheels/*.whl -r requirements.lock.txt -r requirements-build.txt
          elif [[ "${{ matrix.target }}" == "macos-x86_64" ]]; then
            python -m pip install --only-binary=:all: work/mediapipe-intel/wheels/*.whl -r requirements.lock.txt -r requirements-build.txt
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            python -m pip install --only-binary=:all: work/opencv-minimal/wheels/*.whl -r requirements.lock.txt -r requirements-build.txt
          else
            python -m pip install --only-binary=:all: -r requirements.lock.txt -r requirements-build.txt
          fi
          python -m pip check
      - name: Tests, verified models and source diagnostic without a camera
        env:
          FDC_TEST_MINIMAL_OPENCV: ${{ matrix.target != 'windows-x64' && matrix.target != 'macos-x86_64' && '1' || '' }}
        run: |
          python -m unittest discover -s tests -q
          node --test tests/meet_extension.test.mjs
          python setup_models.py
          python tools/ci_native.py diagnose --target ${{ matrix.target }}
      - name: Linux synthetic network syscall sample, no packet capture
        if: runner.os == 'Linux'
        continue-on-error: true # Draft beta only; dependency network verification remains false.
        run: python tools/check_dependency_network.py
      - name: Corresponding sources, native packages and frozen tests
        run: |
          python tools/fetch_distribution_sources.py
          python tools/ci_native.py build
      - name: Upload allowlisted assets only to the matching unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          FDC_DRAFT_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: python tools/release_candidates.py upload --target ${{ matrix.target }}
